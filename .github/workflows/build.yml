name: Build
on:
  workflow_dispatch:
  push:
    branches: [develop]

env:
  CI_NAME: GitHub Actions

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix symlinks
        run: |
          # actions/checkout converts symlinks to regular files, recreate them
          cd app/src/main/assets/shared
          python3 -c "
          import os, pathlib
          for root, dirs, files in os.walk('.'):
              for f in files:
                  path = os.path.join(root, f)
                  if f == 'checksums.json':
                      continue
                  try:
                      with open(path, 'r') as fh:
                          content = fh.read().strip()
                      if content.startswith('../../../../data/rime/'):
                          os.remove(path)
                          os.symlink(content, path)
                  except:
                      pass
          print('Symlinks restored')
          "

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
          ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v4
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-debug-${{ steps.cache-hash.outputs.native-cache-hash }}
          restore-keys: |
            ${{ runner.os }}-trime-jni-debug-

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib app/prebuilt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trime-debug-apk
          path: app/build/outputs/apk/debug/*.apk
