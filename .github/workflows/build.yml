name: Build
on:
  workflow_dispatch:
  push:
    branches: [develop]

env:
  CI_NAME: GitHub Actions

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix symlinks
        run: |
          SHARED="app/src/main/assets/shared"
          # Recreate symlinks for existing rime submodules
          for f in $(find "$SHARED" -maxdepth 1 -type f -not -name "checksums.json"); do
            target=$(head -c 200 "$f" | tr -d '\0')
            if echo "$target" | grep -q '^../../../../data/rime/'; then
              rm -f "$f"
              ln -sf "$target" "$f" || true
            fi
          done
          # Copy rime-frost files from submodule
          rm -rf "$SHARED/rime-frost"
          cp -r app/data/rime/rime-frost "$SHARED/rime-frost"
          rm -rf "$SHARED/rime-frost/.git" "$SHARED/rime-frost/.github"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
          ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v4
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-debug-${{ steps.cache-hash.outputs.native-cache-hash }}
          restore-keys: |
            ${{ runner.os }}-trime-jni-debug-

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib app/prebuilt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trime-debug-apk
          path: app/build/outputs/apk/debug/*.apk
